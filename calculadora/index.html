<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Calculadora Moderna</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="calculator">
  <div class="display">
    <div class="previous-operand" id="previousDisplay"></div>
    <div class="current-operand" id="currentDisplay">0</div>
  </div>
  <div class="buttons">
    <!-- Linha 1 -->
    <button class="clear" id="clearBtn">AC</button>
    <button class="delete" id="deleteBtn">⌫</button>
    <button class="operator" data-operator="/">÷</button>
    <button class="operator" data-operator="*">×</button>

    <!-- Linha 2 -->
    <button data-number="7">7</button>
    <button data-number="8">8</button>
    <button data-number="9">9</button>
    <button class="operator" data-operator="-">−</button>

    <!-- Linha 3 -->
    <button data-number="4">4</button>
    <button data-number="5">5</button>
    <button data-number="6">6</button>
    <button class="operator" data-operator="+">+</button>

    <!-- Linha 4 -->
    <button data-number="1">1</button>
    <button data-number="2">2</button>
    <button data-number="3">3</button>
    <button class="equal" id="equalBtn">=</button>

    <!-- Linha 5: zero e ponto -->
    <button data-number="0" class="span-two">0</button>
    <button data-number=".">.</button>
  </div>
  <footer>calculadora · operações básicas</footer>
</div>
<script src="script.js"></script>
</body>
</html>
